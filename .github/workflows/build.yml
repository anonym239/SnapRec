name: Testen, bauen & veröffentlichen
# - Bei jedem Push: Tests (Linux + Windows) und SnapRec.exe bauen
#   (Actions → Lauf öffnen → Artifacts → SnapRec-Windows)
# - Neue VERSION in snaprec/__init__.py auf main (oder Tag "v…"): automatisch einen
#   GitHub-Release "v<VERSION>" mit der .exe anlegen
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt pytest
      - run: xvfb-run -a python -m pytest -q tests

  windows:
    needs: test-linux
    runs-on: windows-latest
    permissions:
      contents: write   # für den Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller
      - name: Tests unter Windows
        run: python -m pytest -q tests
      - name: SnapRec.exe bauen
        run: >-
          pyinstaller --noconfirm --onefile --windowed --name SnapRec
          --icon assets/icon.ico
          --collect-all imageio_ffmpeg --collect-all customtkinter
          run.py
      - name: Selbsttest der fertigen .exe
        shell: pwsh
        run: |
          $p = Start-Process dist\SnapRec.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: SnapRec-Windows
          path: dist/SnapRec.exe
      - name: Version lesen
        id: version
        shell: pwsh
        run: |
          $v = python -c "import snaprec; print(snaprec.VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} passt nicht zu VERSION $v"; exit 1
          }
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          "exists=$(if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release veröffentlichen
        if: >-
          steps.version.outputs.exists == 'false' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SnapRec v${{ steps.version.outputs.version }}
          body_path: .github/release-notes.md
          files: dist/SnapRec.exe
          make_latest: true
