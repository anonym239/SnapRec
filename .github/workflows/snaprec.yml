name: SnapRec – testen & Windows-Programm bauen
# Testet den Bildschirmrecorder und baut daraus eine fertige SnapRec.exe
# (unter "Actions" → Lauf anklicken → Artifacts → SnapRec-Windows).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt pytest
      - run: xvfb-run -a python -m pytest -q tests

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name SnapRec --collect-all imageio_ffmpeg snaprec.py
      - run: if not exist dist\SnapRec.exe exit 1
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: SnapRec-Windows
          path: dist/SnapRec.exe
